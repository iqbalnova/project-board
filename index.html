<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Board</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2318181b'/%3E%3Cpath d='M8 9h4v14H8zM14 9h4v9h-4zM20 9h4v6h-4z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect width="16" height="16" rx="3.5" fill="currentColor"/>
        <path d="M4 4.5h2v7H4zM7 4.5h2v4.5H7zM10 4.5h2v3h-2z" fill="var(--panel)"/>
      </svg>
      <span>Project Board</span>
    </div>
    <select id="tenant-select" class="tenant-select" aria-label="Pilih Project / Tenant" title="Pilih Project / Tenant Aktif" hidden></select>
    <nav class="tabs" id="tabs">
      <button data-view="timeline">Timeline <span id="pending-badge" class="pill" hidden></span></button>
      <button data-view="kanban">Kanban</button>
    </nav>
    <div class="actions">
      <button class="btn small" id="btn-tenants" title="Kelola Project/Tenant &amp; User (Super Admin)" hidden>⚙️ Kelola Tenant</button>
      <button class="btn small" id="btn-user" title="Akun aktif / Ganti user">User</button>
      <button class="btn ghost icon-only" id="btn-notif" title="Notifikasi perubahan" aria-label="Notifikasi perubahan"></button>
      <button class="btn ghost icon-only" id="btn-theme" title="Ganti tema" aria-label="Ganti tema"></button>
      <button class="btn ghost small" id="btn-log" title="Riwayat perubahan">Riwayat <span id="log-badge" class="pill" hidden></span></button>
      <button class="btn ghost small" id="btn-export" title="Unduh backup JSON">Export</button>
      <label class="btn ghost small" title="Pulihkan dari file backup">Import<input type="file" id="file-import" accept="application/json,.json" hidden></label>
      <button class="btn ghost small danger-text" id="btn-reset" title="Reset database">Clear DB</button>
    </div>
  </header>

  <main id="app"><p class="empty">Memuat…</p></main>

  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" aria-label="Detail Scope &amp; Workspace Tim" hidden></aside>
  <dialog id="dlg"></dialog>
  <div id="notif-stack" class="notif-stack" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="/app.js"></script>
</body>
</html>
