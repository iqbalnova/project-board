services:
  board:
    build: .
    container_name: project-board
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_USERS: ${APP_USERS:-}         # multi-user: user1:pass1,user2:pass2
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-}   # opsional jika masih memakai single user
    volumes:
      - board-data:/data
    mem_limit: 256m
    cpus: 0.5

volumes:
  board-data:
