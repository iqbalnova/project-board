services:
  board:
    build: .
    container_name: project-board
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_USERS: ${APP_USERS:-}         # multi-user: admin:admin123,meisy:meisy123,aceng:aceng123,zudev:zudev123,ocam:ocam123
    volumes:
      - board-data:/data
    mem_limit: 256m
    cpus: 0.5

volumes:
  board-data:
